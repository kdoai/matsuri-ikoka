name: 機能の提案
description: あると旅の前の不安が減る、こんな機能がほしい
title: "[提案] "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        MATSURI IKOKA は、祭りへ行く前の2つの壁（情報と計画）を取り除くための道具です。
        提案が、どの壁をどう低くするかを書いていただけると、優先を決めやすくなります。

        **この Issue は公開されます。** 個人の連絡先は書かないでください。

  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: いま何ができなくて、どんな場面で困るか
    validations:
      required: true

  - type: dropdown
    id: wall
    attributes:
      label: 取り除きたい壁
      multiple: true
      options:
        - 情報（祭りがあること・いつどこでかが分からない）
        - 計画（行き方・泊まり・時間の組み立てが難しい）
        - どれでもない・分からない
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: こうなるとよい
      description: 画面やしおりで、どう見えて、どう使えるとよいか
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: いまの回り道や、ほかの案
    validations:
      required: false
