name: CI

# PR と main への push で、検査を別々のジョブで並べて走らせる。
# ジョブの name は main のルールセットの必須の検査（scripts/setup-github.sh の REQUIRED_CHECKS）と同じにする。

on:
  push:
    branches: [main]
  pull_request:
  # 祭りのデータの確かめ直し（update-festivals.yml）が開いた PR のブランチで走らせる
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR の古い実行は止める。main の実行は、コミットごとに最後まで残す
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Biome（lint と format）
        run: pnpm exec biome ci .

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 型チェック
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: テスト（Vitest）
        run: pnpm test

  validate-data:
    name: validate-data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 祭りのデータの検証
        run: pnpm validate:data

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ビルド
        run: pnpm build

  # 画面の通しテスト。Playwright が接客サーバーをモック（MATSURI_AGENT_MODE=mock）で起動し、
  # 画面の開発サーバーからつなぐ（apps/web/playwright.config.ts）
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Playwright のブラウザのキャッシュ
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Chromium を入れる
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @matsuri-ikoka/web exec playwright install --with-deps chromium

      - name: Chromium の動作に要るライブラリを入れる
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @matsuri-ikoka/web exec playwright install-deps chromium

      - name: 通しテスト（Playwright）
        run: pnpm --filter @matsuri-ikoka/web test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/web/test-results
          retention-days: 7

  # デプロイと同じイメージを作り、モックで動かして、相談・しおりの PDF・3D のモデルが配られるかを確かめる
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: イメージを作る
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: matsuri-ikoka:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: イメージをモックで動かして確かめる
        run: |
          docker run -d --name mock --read-only --tmpfs /tmp \
            -e MATSURI_AGENT_MODE=mock -e MATSURI_REPLAY_SPEED=0 \
            -p 127.0.0.1:8080:8080 matsuri-ikoka:ci
          if ! ./scripts/check-health.sh http://127.0.0.1:8080/healthz \
            || ! node scripts/smoke-mock.mjs --pdf --glb http://127.0.0.1:8080; then
            docker logs mock
            exit 1
          fi
          docker rm -f mock

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks で履歴全体を調べるため
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks を入れる
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 秘密情報の混入チェック（gitleaks）
        run: gitleaks git --redact --verbose .

  # ワークフローの書き方を確かめる（run の中のシェルは、ランナーにある shellcheck でも見る）
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint を入れる
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: ワークフローを確かめる
        run: actionlint -color

  # PR で足した依存に、既知の脆弱性がないかを見る
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # すべてのジョブの結果をまとめる。main のルールセットが前から必須にしている名前なので残す
  # （ジョブを足しても、この名前を必須にしておけば漏れない）
  required:
    name: 検査とビルド
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - validate-data
      - build
      - e2e
      - docker
      - secrets
      - actionlint
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: どのジョブも失敗していないかを確かめる
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "結果：$RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
