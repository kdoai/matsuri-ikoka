name: CodeQL

# コードとワークフローの静的な解析。結果は GitHub の Security の画面（code scanning）に出る。

on:
  push:
    branches: [main]
    # 文書だけの変更では解析しない（解析の対象のコードもワークフローも含まない）。
    # 一覧は deploy.yml と同じにする（scripts/github-config.test.ts で突き合わせる）
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "*.md"
      - "**/README.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "*.md"
      - "**/README.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  schedule:
    # 毎週月曜の 6:00（日本時間）
    - cron: "0 21 * * 0"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
