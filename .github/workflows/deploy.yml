name: デプロイ

# main に入った変更を Cloud Run に出す。
# イメージをモックで動かして /healthz・サンプルの相談・しおりの PDF・3D のモデルを確かめ、
# 新しい版を通信なしで置いて外から確かめてから（scripts/check-deployed.mjs）、通信を切り替える。
# 切り替える前に失敗したら、通信は前の版のまま。切り替えたあとの確かめに失敗したら、通信を前の版に戻す。
# 手で前の版に戻すときは rollback.yml を使う（docs/spec/operations.md の「前の版に戻す」）。
# サービスの設定（環境変数・シークレット・CPU とメモリ）は Cloud Run の側にあり、ここではイメージを差し替える。
# インスタンスの数（最小 0・最大 1）、リクエストの時間切れ、live で動くことと保存先（Firestore）、
# 1回の発言の費用の上限（AGENT_MAX_BUDGET_USD）、利用者の IP の決め方（TRUSTED_PROXY_HOPS）は、
# コンソールで変わっていても版ごとにここで決め直す。
# 使う GitHub Actions の変数は docs/spec/operations.md の「デプロイ」にある。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  # 順番が来た時点で main の先頭でなければ出さない。古いコミットの再実行で、本番が前のコードに戻らないようにする
  latest:
    name: main の先頭かを確かめる
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tip: ${{ steps.check.outputs.tip }}
    steps:
      - id: check
        run: |
          head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)"
          if [[ -z "$head" ]]; then
            echo "main の先頭を読めませんでした" >&2
            exit 1
          fi
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_SHA} は main の先頭（${head}）ではないので、デプロイを飛ばします"
          fi

  deploy:
    name: Cloud Run に出す
    needs: latest
    if: needs.latest.outputs.tip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Workload Identity 連携で、鍵のファイルなしに Google Cloud に入る
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      # リクエストの時間切れ（秒）。相談1回の全体の上限（TURN_MAX_MS の10分）のあとに、
      # 時間切れの案内と done を送り終える時間を足す（scripts/deploy-config.test.ts で確かめる）
      REQUEST_TIMEOUT_SECONDS: "660"
      # 利用者との間のプロキシの数。Cloud Run の既定の URL では 1（docs/spec/operations.md の「利用者の IP」）。
      # 前にロードバランサーを置くときは、GitHub Actions の変数 TRUSTED_PROXY_HOPS で変える
      TRUSTED_PROXY_HOPS: ${{ vars.TRUSTED_PROXY_HOPS || '1' }}
    steps:
      - name: 変数がそろっているか確かめる
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=()
          for name in PROJECT_ID REGION SERVICE REPOSITORY WORKLOAD_IDENTITY_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "GitHub Actions の変数が足りません：${missing[*]}" >&2
            exit 1
          fi
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/server" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Artifact Registry に入る
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: イメージを作って置く
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: イメージをモックで動かし、/healthz・サンプルの相談・しおりの PDF・3D のモデルを確かめる
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run -d --name mock --read-only --tmpfs /tmp \
            -e MATSURI_AGENT_MODE=mock -e MATSURI_REPLAY_SPEED=0 \
            -p 127.0.0.1:8080:8080 "${IMAGE}@${DIGEST}"
          if ! ./scripts/check-health.sh http://127.0.0.1:8080/healthz \
            || ! node scripts/smoke-mock.mjs --pdf --glb http://127.0.0.1:8080; then
            docker logs mock
            exit 1
          fi
          docker rm -f mock

      - name: 新しい版を通信なしで置く
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${IMAGE}@${DIGEST}" \
            --min-instances 0 --max-instances 1 \
            --timeout "$REQUEST_TIMEOUT_SECONDS" \
            --update-env-vars "MATSURI_AGENT_MODE=live,MATSURI_STORAGE=firestore,FIREBASE_PROJECT_ID=${PROJECT_ID},AGENT_MAX_BUDGET_USD=1,TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS}" \
            --no-traffic --tag candidate --quiet

      # 合言葉（ACCESS_PASSCODE）をサービスに設定しているときだけ、相談の API が守られていることを求める。
      # 設定してある環境変数の名前（値は読まない）を控え、足りない設定を外からの確かめで知らせる
      - name: サービスに合言葉が設定されているかを調べる
        id: passcode
        run: |
          set -o pipefail
          # 読めないまま進むと「合言葉なし」と取り違えるので、読めなければ理由を書いて止める
          if ! service="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json)"; then
            echo "::error::サービスの設定を読めなかったので、合言葉の有無を決められません" >&2
            exit 1
          fi
          names="$(jq -r '[.spec.template.spec.containers[0].env[]?.name] | join(",")' <<<"$service")"
          if [[ -z "$names" ]]; then
            echo "::error::サービスに環境変数が1つもありません（新しい版を置いたあとは、少なくとも MATSURI_AGENT_MODE がある）" >&2
            exit 1
          fi
          if [[ ",${names}," == *",ACCESS_PASSCODE,"* ]]; then set=true; else set=false; fi
          echo "set=${set}" >> "$GITHUB_OUTPUT"
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "合言葉：${set}"

      # Cloud Run の既定の URL では /healthz が外から届かないので、/health で確かめる
      - name: 新しい版を外から確かめる（/health・画面・3D のモデル・合言葉・しおりの経路）
        env:
          ACCESS_PASSCODE_SET: ${{ steps.passcode.outputs.set }}
          SERVICE_ENV_NAMES: ${{ steps.passcode.outputs.names }}
        run: |
          url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
          ./scripts/check-health.sh "${url}/health"
          node scripts/check-deployed.mjs "$url"

      # 戻す先：いま通信をすべて受けている版
      - name: いまの版を控える
        id: previous
        run: |
          revision="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName] | first // ""')"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "前の版：${revision:-なし}"

      - name: 通信を新しい版に切り替える
        id: switch
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --to-latest --quiet

      - name: 公開の URL を外から確かめる
        env:
          ACCESS_PASSCODE_SET: ${{ steps.passcode.outputs.set }}
          SERVICE_ENV_NAMES: ${{ steps.passcode.outputs.names }}
        run: |
          url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          ./scripts/check-health.sh "${url}/health"
          node scripts/check-deployed.mjs "$url"

      - name: 確かめに失敗したので、通信を前の版に戻す
        if: failure() && steps.switch.outcome == 'success' && steps.previous.outputs.revision != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "${PREVIOUS}=100" --quiet
          echo "::error::公開の URL の確かめに失敗したため、通信を ${PREVIOUS} に戻しました"
