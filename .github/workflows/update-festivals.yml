name: 祭りのデータの週次の調査

# 調査そのものは Claude Managed Agents の定期実行（毎週月曜 6:00、日本時間）が行う。
# このワークフローはモデルを使わず、その前後の短い仕事だけを行う（scripts/research-run.ts）。
# - 準備：今週の調査リストをコードで選び、セッションが読むだけの Store に置く
# - 回収：終わったセッションの報告をコードで確かめ、変える祭りと調査の台帳を PR にする
# - 適用：managed-agents/ のファイルを ant apply で API に反映し、claude-lock.json を PR にする
# 認証は Workload Identity Federation で、API キーを置かない。連携のルールはこのファイルの main からの
# schedule と workflow_dispatch だけを受け付けるので、ファイル名を変えるときはルールも直す。
# 変数 MATSURI_REFRESH_ENABLED が true でないあいだは、定期のきっかけでは何もしない。
# 使う変数は docs/spec/operations.md の「祭りのデータの更新」にある。

on:
  schedule:
    # 準備：日曜 21:00（日本時間）
    - cron: "0 12 * * 0"
    # 回収：月曜 12:00、18:00、火曜 6:00（日本時間）。動いている途中なら次の回で確かめる
    - cron: "0 3 * * 1"
    - cron: "0 9 * * 1"
    - cron: "0 21 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: 行うこと
        type: choice
        options:
          - collect
          - prepare
          - trigger
          - plan
          - setup
        default: collect
      limit:
        description: 調査リストの件数の上限（prepare のとき。空なら上限なし）
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: update-festivals
  cancel-in-progress: false

jobs:
  research:
    name: 準備と回収
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MATSURI_REFRESH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # 依頼の Issue と確認待ちの PR を読む
      issues: read
      pull-requests: read
      # GitHub の ID トークンを短い Anthropic のトークンに換える
      id-token: write
    outputs:
      changed: ${{ steps.run.outputs.changed }}
      review: ${{ steps.run.outputs.review }}
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      MATSURI_REFRESH_ENABLED: ${{ vars.MATSURI_REFRESH_ENABLED }}
      # 定期のきっかけは、どの cron かで仕事を決める
      MODE: ${{ inputs.mode || (github.event.schedule == '0 12 * * 0' && 'prepare') || 'collect' }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: 依頼の Issue と確認待ちの祭りを集める
        if: env.MODE == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,body,labels > "$RUNNER_TEMP/issues.json"
          # ブランチは自動の更新だけが作る。ファイル名は祭りの ID
          gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 50 --json headRefName,files \
            --jq '.[] | select(.headRefName | startswith("chore/refresh-festivals-")) | .files[].path' \
            | sed -n 's|^data/festivals/\([a-z0-9-]*\)\.json$|\1|p' > "$RUNNER_TEMP/under-review.txt"

      # ant は版とチェックサムで固定して入れる
      - name: ant を入れる
        if: env.MODE == 'setup' || env.MODE == 'plan'
        env:
          ANT_VERSION: 2.7.1
          ANT_SHA256: 7c4bf5081532d994201bc3678657c8f314e487c521ec53937d15c0aca25c2bf0
        run: |
          archive="$RUNNER_TEMP/ant.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/anthropics/anthropic-cli/releases/download/v${ANT_VERSION}/ant_${ANT_VERSION}_linux_amd64.tar.gz"
          echo "$ANT_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" ant
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: 実行する
        id: run
        run: |
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/identity-token"
          fetch_token() {
            curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          # GitHub の ID トークンは約5分で切れるので、SDK が換え直せるよう更新し続ける
          ( while sleep 240; do fetch_token; done ) &
          refresher=$!
          trap 'kill "$refresher"' EXIT
          case "$MODE" in
            plan)
              (cd managed-agents && ant apply --dry-run -v .)
              ;;
            setup)
              # GitHub の ID トークンは1回しか換えられないので、コマンドごとに取り直す
              applied=0
              (cd managed-agents && ant apply --yes .) || applied=$?
              # 途中で失敗しても、作れた資源の記録を残す
              mkdir -p "$RUNNER_TEMP/refresh"
              if ! git diff --quiet -- managed-agents/claude-lock.json \
                || [[ -n "$(git ls-files --others --exclude-standard managed-agents/claude-lock.json)" ]]; then
                cp managed-agents/claude-lock.json "$RUNNER_TEMP/refresh/"
                echo "Managed Agents の資源の ID の記録を更新します。" > "$RUNNER_TEMP/refresh/body.md"
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "review=auto" >> "$GITHUB_OUTPUT"
              fi
              (( applied == 0 )) || exit "$applied"
              fetch_token
              pnpm --silent research schedule
              ;;
            trigger) pnpm --silent research trigger ;;
            prepare)
              args=(--issues "$RUNNER_TEMP/issues.json" --under-review "$RUNNER_TEMP/under-review.txt")
              [[ -n "$LIMIT" ]] && args+=(--limit "$LIMIT")
              pnpm --silent research prepare "${args[@]}"
              ;;
            collect)
              mkdir -p "$RUNNER_TEMP/refresh"
              pnpm --silent research collect --out "$RUNNER_TEMP/refresh"
              ;;
            *) echo "想定しない仕事：$MODE" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # 適用が途中で失敗しても、作れた資源の記録は PR にする
        if: always() && steps.run.outputs.changed == 'true'
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh
          retention-days: 7

  pull-request:
    name: PR を開く
    needs: research
    if: always() && needs.research.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # ブランチを push する
      contents: write
      pull-requests: write
      # PR の CI を承認する（GITHUB_TOKEN で開いた PR の CI は、承認されるまで動かない）
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh

      - name: ブランチにコミットして PR を開く
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-festivals-${{ github.run_id }}
          # 祭りの中身が変わる PR は人が確かめる。status:manual の PR は自動ではマージしない
          REVIEW: ${{ needs.research.outputs.review }}
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          if [[ -f "$RUNNER_TEMP/refresh/claude-lock.json" ]]; then
            # 適用の記録だけを置く
            cp "$RUNNER_TEMP/refresh/claude-lock.json" managed-agents/claude-lock.json
            git add managed-agents/claude-lock.json
            title="chore(infra): Managed Agents の資源の ID の記録を更新する（${today}）"
            labels=(--label type:task --label area:infra)
          else
            # 確かめた祭りのファイルと台帳だけを置く（ファイル名はデータの ID）
            shopt -s nullglob
            for file in "$RUNNER_TEMP"/refresh/festivals/*.json; do
              name="$(basename "$file")"
              [[ "$name" =~ ^[a-z0-9-]+\.json$ ]] || { echo "想定しないファイル名：$name" >&2; exit 1; }
              cp "$file" "data/festivals/$name"
            done
            cp "$RUNNER_TEMP/refresh/research-ledger.json" data/research-ledger.json
            git add data/festivals data/research-ledger.json
            title="chore(data): 祭りのデータの週次の調査の結果（${today}）"
            labels=(--label type:data --label area:data)
          fi
          [[ "$REVIEW" == "human" ]] && labels+=(--label status:manual)
          git commit -m "$title"
          git push origin "$BRANCH"
          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/refresh/body.md" \
            "${labels[@]}"
          # 必須の検査になるのは PR に結びついた CI だけなので、承認待ちの実行を動かす。
          # ブランチにあるのは、このジョブが置いたファイルだけ。実行が現れるまで少しかかる
          head="$(git rev-parse HEAD)"
          ci_approved=false
          for _ in {1..12}; do
            sleep 5
            while read -r id name; do
              [[ -n "$id" ]] || continue
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null
              if [[ "$name" == "CI" ]]; then ci_approved=true; fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request&status=action_required" \
              --jq '.workflow_runs[] | "\(.id) \(.name)"')
            if [[ "$ci_approved" == true ]]; then break; fi
          done
          [[ "$ci_approved" == true ]] || { echo "承認待ちの CI が見つかりません" >&2; exit 1; }
