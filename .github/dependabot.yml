version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # ワークフローと、共通の手順（.github/actions/*）の両方を見る
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ["*"]
